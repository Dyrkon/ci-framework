---
- name: Prepare a runtime bare-metal root password for a nodeset env file
  hosts: "{{ cifmw_target_hook_host | default('localhost') }}"
  connection: local
  vars:
    # Public interface, passed as extra_vars by the calling job:
    #   baremetalset_password_run_id  - unique run ID (safe charset) used to
    #                                   namespace the persisted password file
    #   baremetalset_password_nodeset - nodeset directory (relative to the
    #                                   architecture repo root) that owns
    #                                   baremetalset-password.env
    #   baremetalset_password_architecture_repo - architecture repo override
    _arch_repo: >-
      {{
        baremetalset_password_architecture_repo |
        default(
          cifmw_architecture_repo |
          default(ansible_user_dir ~ '/src/github.com/openstack-k8s-operators/architecture')
        )
      }}
    _nodeset_dir: >-
      {{ [_arch_repo, baremetalset_password_nodeset] | path_join }}
    _run_id: "{{ baremetalset_password_run_id }}"
    _password_file: >-
      {{ ansible_user_dir }}/.config/cifmw-validation/{{ _run_id }}.password
  tasks:
    - name: Require an explicit run ID and nodeset
      ansible.builtin.assert:
        that:
          - baremetalset_password_nodeset is defined
          - baremetalset_password_run_id is defined
          - baremetalset_password_run_id | default('') is match('^[a-zA-Z0-9_-]+$')
        fail_msg: >-
          Pass baremetalset_password_run_id (alphanumerics, dashes and
          underscores only, e.g. the Zuul build ID) and
          baremetalset_password_nodeset (nodeset directory relative to the
          architecture repo root).

    - name: Require the env-file password mechanism
      ansible.builtin.slurp:
        src: "{{ _nodeset_dir }}/kustomization.yaml"
      register: _component

    - name: Check the password generator contract
      vars:
        _generators: >-
          {{ (_component.content | b64decode | from_yaml).secretGenerator |
             default([]) | selectattr('name', 'equalto', 'baremetalset-password-secret') | list }}
      ansible.builtin.assert:
        that:
          - _generators | length == 1
          - "'baremetalset-password.env' in _generators[0].envs"
          - _generators[0].options.disableNameSuffixHash | bool
        fail_msg: >-
          The nodeset must generate baremetalset-password-secret from the
          baremetalset-password.env file through its secretGenerator.

    - name: Check that the tracked password env file exists
      ansible.builtin.stat:
        path: "{{ _nodeset_dir }}/baremetalset-password.env"
        get_checksum: false
      register: _password_env

    - name: Refuse to create a missing source env file
      ansible.builtin.assert:
        that:
          - _password_env.stat.exists
          - _password_env.stat.isreg

    - name: Keep per-run passwords outside collected artifacts
      ansible.builtin.file:
        path: "{{ _password_file | dirname }}"
        state: directory
        mode: "0700"

    - name: Generate or reuse this run's password
      no_log: true
      ansible.builtin.set_fact:
        _root_password: "{{ lookup('ansible.builtin.password', _password_file, length=32, chars=['ascii_letters', 'digits']) }}"

    - name: Require a non-placeholder generated password
      no_log: true
      ansible.builtin.assert:
        that:
          - _root_password is match('^[a-zA-Z0-9]{32}$')
          - _root_password not in ['CHANGEME', 'redhat']

    - name: Protect the persisted password
      ansible.builtin.file:
        path: "{{ _password_file }}"
        mode: "0600"

    - name: Populate the source env file before kustomize builds the nodeset
      no_log: true
      diff: false
      ansible.builtin.copy:
        dest: "{{ _nodeset_dir }}/baremetalset-password.env"
        content: "NodeRootPassword={{ _root_password }}\n"
        mode: "0600"
