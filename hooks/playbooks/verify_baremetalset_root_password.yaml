---
- name: Verify the deployed bare-metal password secret
  hosts: "{{ cifmw_target_hook_host | default('localhost') }}"
  connection: local
  vars:
    # Same public interface as prepare_baremetalset_root_password.yaml.
    _arch_repo: >-
      {{
        baremetalset_password_architecture_repo |
        default(
          cifmw_architecture_repo |
          default(ansible_user_dir ~ '/src/github.com/openstack-k8s-operators/architecture')
        )
      }}
    _nodeset_dir: >-
      {{ [_arch_repo, baremetalset_password_nodeset] | path_join }}
    _run_id: "{{ baremetalset_password_run_id }}"
    _password_file: >-
      {{ ansible_user_dir }}/.config/cifmw-validation/{{ _run_id }}.password
  tasks:
    - name: Require an explicit run ID and nodeset
      ansible.builtin.assert:
        that:
          - baremetalset_password_nodeset is defined
          - baremetalset_password_run_id is defined
          - baremetalset_password_run_id | default('') is match('^[a-zA-Z0-9_-]+$')
        fail_msg: >-
          Pass the same baremetalset_password_run_id and
          baremetalset_password_nodeset that were used at preparation time.

    - name: Read this run's expected password
      no_log: true
      ansible.builtin.slurp:
        src: "{{ _password_file }}"
      register: _expected

    - name: Read the env file consumed by the nodeset build
      no_log: true
      ansible.builtin.slurp:
        src: "{{ _nodeset_dir }}/baremetalset-password.env"
      register: _password_env

    - name: Read the live password secret without logging its value
      no_log: true
      environment:
        KUBECONFIG: "{{ cifmw_openshift_kubeconfig }}"
        PATH: "{{ cifmw_path | default(ansible_env.PATH) }}"
      ansible.builtin.command:
        argv:
          - oc
          - -n
          - "{{ namespace | default('openstack') }}"
          - get
          - secret
          - baremetalset-password-secret
          - -o
          - json
      changed_when: false
      register: _secret

    - name: Compare the persisted password, env file and live secret
      no_log: true
      vars:
        _password: "{{ _expected.content | b64decode | trim }}"
        _live_secret: "{{ _secret.stdout | from_json }}"
      ansible.builtin.assert:
        that:
          - _password is match('^[a-zA-Z0-9]{32}$')
          - (_password_env.content | b64decode) == 'NodeRootPassword=' ~ _password ~ '\n'
          - (_live_secret.data.NodeRootPassword | b64decode) == _password

    - name: Report password verification without exposing the value
      ansible.builtin.debug:
        msg: The live bare-metal password secret matches this run's generated env-file password.
